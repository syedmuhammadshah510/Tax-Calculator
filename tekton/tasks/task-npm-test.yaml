apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-test
spec:
  description: "Executes Jasmine unit tests for the Tax Calculator Node.js app"
  workspaces:
    - name: source
      description: "Holds the cloned Git repository containing package.json and spec/"
  steps:
    - name: run-jasmine-tests
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "=== Installing dependencies ==="
        npm ci

        echo "=== Running Jasmine unit tests ==="
        npm test
        echo "All unit tests passed successfully!"
