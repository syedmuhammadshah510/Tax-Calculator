apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-and-push
spec:
  description: "Builds a Docker image with Buildah and pushes to IBM Cloud Container Registry"
  params:
    - name: IMAGE
      type: string
      description: "Full image reference including registry host, namespace, and tag"
    - name: DOCKERFILE
      type: string
      default: "./Dockerfile"
      description: "Path to Dockerfile inside the source workspace"
    - name: TLSVERIFY
      type: string
      default: "true"
      description: "Verify TLS when pushing to registry"
  workspaces:
    - name: source
      description: "Holds the source code with Dockerfile"
  steps:
    - name: build-and-push-image
      image: quay.io/buildah/stable:v1.31.0
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -e
        echo "=== Building container image with Buildah ==="
        buildah bud \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          -f $(params.DOCKERFILE) \
          -t $(params.IMAGE) .

        echo "=== Pushing image to registry: $(params.IMAGE) ==="
        buildah push \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          $(params.IMAGE)

        echo "Image successfully built and pushed!"
